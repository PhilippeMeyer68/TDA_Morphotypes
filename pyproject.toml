[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tda-morphotypes"
version = "1.0.0"
description = "Human body shapes anomaly detection and classification using persistent homology (Algorithms, 2023)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Philippe Meyer" },
    { name = "Steve de Rose" },
]
dependencies = [
    "gudhi>=3.8",
    "matplotlib>=3.7",
    "meshio>=5.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7", "pot>=0.9"]

[project.scripts]
tda-morphotypes = "tda_morphotypes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tda_morphotypes = ["reference/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
